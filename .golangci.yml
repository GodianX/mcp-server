    gosec:
      excludes:
        - G104
        - G117
      config:
        global:
          audit: true

    rowserrcheck:
      packages:
        - database/sql
        - gorm.io/gorm

    testifylint:
      enable-all: true
      disable:
        - require-error



    unparam:
      check-exported: false

    mnd:
      checks:
        - argument
        - case
        - condition
        - return
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "10"
        - "24"
        - "100"
        - "365"
      ignored-functions:
        - "make"
        - "context.WithTimeout"
        - "time.*"
      ignored-files:
        -  testhelpers/*.go

    forbidigo:
      forbid:
        - pattern: "^fmt\\.Print.*$"
          msg: "use structured logging instead (slog)"
      exclude-godoc-examples: true
      analyze-types: true

    prealloc:
      simple: true
      for-loops: true

    interfacebloat:
      max: 10

    nestif:
      min-complexity: 3

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
  new: false

formatters:
  enable:
    - gofumpt
    - golines
    - swaggo

  settings:
    gofumpt:
      module-path: web-search
    golines:
      max-len: 140
      tab-len: 4
      shorten-comments: true
      reformat-tags: true
      chain-split-dots: false
