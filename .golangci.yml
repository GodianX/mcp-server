version: "2"

run:
  timeout: 10m
  tests: true
  allow-parallel-runners: true
  go: '1.27'
  modules-download-mode: readonly

linters:
  default: all
  disable:
    - gochecknoinits
    - nolintlint
    - nilnil
    - dupl
    - ireturn
    - wrapcheck
    - varnamelen
    - gochecknoglobals
    - exhaustruct
    - exhaustruct_v5
    - gomodguard
    - depguard
    - wsl
    - tparallel
    - paralleltest
    - tagliatelle
    - nonamedreturns
    - cyclop
    - godox
    - nosprintfhostport
    - godot
    - err113

  exclusions:
    rules:
      - linters:
          - errcheck
        source: 'errors\.AsType\['

      - path: _test\.go
        linters:
          - funlen
          - gocognit
          - goconst
          - gosec
          - mnd
          - dupl
          - errcheck
          - forcetypeassert
          - wrapcheck

      - path: internal/root/
        linters:
          - funlen

      - path: migrations/
        linters:
          - all

      - path: ".*\\.pb\\.go$"
        linters:
          - all

      - path: cmd/docs/
        linters:
          - all

      - source: "TODO"
        linters:
          - godox

  settings:
    cyclop:
      max-complexity: 15
      package-average: 5.0

    gocognit:
      min-complexity: 20

    gocyclo:
      min-complexity: 15

    funlen:
      lines: 80
      statements: 50
      ignore-comments: true

    lll:
      line-length: 140
      tab-width: 4

    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
          xml: snake
          bson: snake
          mapstructure: snake
          env: upperSnake
          envconfig: upperSnake

    tagalign:
      align: true
      sort: true
      order:
        - gorm
        - json
        - binding
        - yaml
        - xml
        - bson
        - validate
        - mapstructure
        - envconfig
        - form
        - default
        - extensions
        - enums

    nlreturn:
      block-size: 2

    godot:
      scope: declarations
      capital: true

    varnamelen:
      min-name-length: 2
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
      ignore-names:
        - err
        - ok
        - id
        - tx
        - db
        - wg
        - mu
        - ctx
        - fn
        - i
        - j
        - k
        - v
        - c
        - w
        - r

    nonamedreturns:
      report-error-in-defer: true

    revive:
      severity: error
      enable-all-rules: false
      rules:
        - name: blank-imports
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T"
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
          arguments:
            - checkPrivateReceivers
            - sayRepetitiveInsteadOfStutters
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
          arguments:
            - []
            - []
            - - skip-initialism-name-checks: true
                upper-case-const: true
                skip-package-name-checks: true
                skip-package-name-collision-with-go-std: true
                extra-bad-package-names: []

    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - io.Copy
        - (io.Closer).Close
        - (*os.File).Close
        - (*github.com/xuri/excelize/v2.File).Close
        - (*pgx.Conn).Close

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
        - opinionated
      disabled-checks:
        - whyNoLint
        - hugeParam
        - rangeValCopy
        - commentFormatting
        - paramTypeCombine

    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    staticcheck:
      dot-import-whitelist:
        - fmt
